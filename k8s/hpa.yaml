apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: fast-feet-api-hpa
  namespace: k8s-lab-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fast-feet-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu        
        target: 
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target: 
          type: Utilization
          averageUtilization: 80

