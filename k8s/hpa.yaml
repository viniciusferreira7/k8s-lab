apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: fast-feet-api-hpa
  namespace: k8s-lab-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fast-feet-api
  minReplicas: 4
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu        
        target: 
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target: 
          type: Utilization
          averageUtilization: 80
  behavior: 
    scaleDown:
      stabilizationWindowSeconds: 120
      policies: 
        - type: Pods
          value: 2
          periodSeconds: 15
        - type: Percent
          value: 10
          periodSeconds: 30
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 5
      policies:
        - type: Pods
          value: 2
          periodSeconds: 5
        - type: Percent
          value: 20
          periodSeconds: 5
        
      selectPolicy: Max


